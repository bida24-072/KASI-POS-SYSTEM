<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasi POS — Point of Sale System</title>
    <meta name="description" content="A fast, modern point of sale system for Botswana shops.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- LEFT: PRODUCTS -->
        <section class="products-panel">

            <div class="top-bar">
                <div class="brand">
                    <div class="brand-mark">KC</div>
                    <div class="brand-text">
                        <h1>Kasi Corner Store</h1>
                        <span>POS · Gaborone</span>
                    </div>
                </div>
                <div class="top-actions">
                    <a href="index.html" class="nav-link active"><i class="fas fa-cash-register"></i><span>POS</span></a>
                    <a href="inventory.html" class="nav-link"><i class="fas fa-boxes-stacked"></i><span>Inventory</span></a>
                    <a href="dashboard.html" class="nav-link"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
                    <div class="time-display" id="clock">--:--:--</div>
                </div>
            </div>

            <div class="search-bar">
                <div class="search-input">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Search products by name...">
                </div>
            </div>

            <div class="categories" id="categories"></div>

            <div class="products-scroll">
                <div class="products-grid" id="products-grid"></div>
            </div>

        </section>

        <!-- RIGHT: CART -->
        <aside class="cart-panel">
            <div class="cart-header">
                <h2>Current Sale</h2>
                <span class="cart-count" id="cart-count">0 items</span>
            </div>

            <div class="cart-items" id="cart-items"></div>

            <div class="cart-footer">
                <div class="summary-row">
                    <span>SUBTOTAL</span>
                    <span id="summary-subtotal">P0.00</span>
                </div>
                <div class="summary-row">
                    <span>VAT (12%)</span>
                    <span id="summary-vat">P0.00</span>
                </div>
                <div class="summary-row total">
                    <span>TOTAL</span>
                    <span id="summary-total">P0.00</span>
                </div>
                <button class="checkout-btn" id="checkout-btn" onclick="checkout()" disabled>
                    <i class="fas fa-check"></i> Complete Sale
                </button>
                <button class="clear-cart-btn" onclick="clearCart()">
                    <i class="fas fa-trash"></i> Clear Cart
                </button>
            </div>
        </aside>

    </div>

    <!-- RECEIPT MODAL -->
    <div class="modal-overlay" id="receipt-modal">
        <div class="receipt" id="receipt"></div>
        <div style="position:absolute; bottom:30px; left:50%; transform:translateX(-50%); width:100%; max-width:360px; padding:0 20px;">
            <div class="modal-actions">
                <button class="btn-print" onclick="printReceipt()">
                    <i class="fas fa-print"></i> Print
                </button>
                <button class="btn-close" onclick="closeReceipt()">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
