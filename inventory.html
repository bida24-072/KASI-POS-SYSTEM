<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory — Kasi POS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-layout">
        <div class="page-container">

            <div class="page-title" style="display:flex; justify-content:space-between; align-items:end; flex-wrap:wrap; gap:20px;">
                <div>
                    <h1>Inventory <em>Manager</em></h1>
                    <p>Add, edit, or remove products. Stock levels update automatically when sales are completed.</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <a href="index.html" class="btn btn-outline">
                        <i class="fas fa-cash-register"></i> Back to POS
                    </a>
                    <button class="btn" onclick="toggleForm()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </div>
            </div>

            <!-- Add/Edit form -->
            <div class="form-panel" id="form-panel">
                <h3 id="form-title">Add New Product</h3>
                <form id="product-form" onsubmit="saveProduct(event)">
                    <input type="hidden" id="f-id">
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Product Name</label>
                            <input type="text" id="f-name" required placeholder="e.g. Coca-Cola 500ml">
                        </div>
                        <div class="form-field">
                            <label>Category</label>
                            <select id="f-category" required>
                                <option value="drinks">Drinks</option>
                                <option value="food">Food</option>
                                <option value="snacks">Snacks</option>
                                <option value="airtime">Airtime</option>
                                <option value="household">Household</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Price (Pula)</label>
                            <input type="number" step="0.01" id="f-price" required placeholder="0.00">
                        </div>
                        <div class="form-field">
                            <label>Stock Quantity</label>
                            <input type="number" id="f-stock" required placeholder="0">
                        </div>
                        <div class="form-field">
                            <label>Emoji</label>
                            <input type="text" id="f-emoji" maxlength="4" placeholder="🥤">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline" onclick="toggleForm()">Cancel</button>
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Save Product</button>
                    </div>
                </form>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card amber">
                    <span class="label">Total Products</span>
                    <div class="value" id="stat-total">0</div>
                </div>
                <div class="stat-card green">
                    <span class="label">Total Stock Value</span>
                    <div class="value" id="stat-value">P0</div>
                </div>
                <div class="stat-card blue">
                    <span class="label">Low Stock Items</span>
                    <div class="value" id="stat-low">0</div>
                </div>
                <div class="stat-card">
                    <span class="label">Out of Stock</span>
                    <div class="value" id="stat-out">0</div>
                </div>
            </div>

            <!-- Products table -->
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width:60px;"></th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="main.js"></script>
    <script>
        /* Inventory-specific script */
        function renderInventory() {
            const tbody = document.getElementById("inventory-body");
            if (!tbody) return;
            tbody.innerHTML = "";
            store.products.forEach(p => {
                const low = p.stock <= 5 && p.stock > 0;
                const out = p.stock <= 0;
                tbody.innerHTML += `
                    <tr>
                        <td class="table-emoji">${p.emoji}</td>
                        <td><strong>${p.name}</strong></td>
                        <td style="text-transform:capitalize;color:var(--muted);">${p.category}</td>
                        <td style="font-family:var(--mono);color:var(--amber);">P${p.price.toFixed(2)}</td>
                        <td>
                            <span style="font-family:var(--mono); font-weight:700; color:${out ? 'var(--red)' : low ? 'var(--amber)' : 'var(--text)'};">
                                ${p.stock}
                            </span>
                        </td>
                        <td style="text-align:right;">
                            <button class="btn btn-outline btn-sm" onclick="editProduct(${p.id})" style="margin-right:6px;">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            updateInventoryStats();
        }

        function updateInventoryStats() {
            const total = store.products.length;
            const value = store.products.reduce((s, p) => s + p.price * p.stock, 0);
            const low = store.products.filter(p => p.stock > 0 && p.stock <= 5).length;
            const out = store.products.filter(p => p.stock <= 0).length;
            document.getElementById("stat-total").textContent = total;
            document.getElementById("stat-value").textContent = `P${value.toFixed(0)}`;
            document.getElementById("stat-low").textContent = low;
            document.getElementById("stat-out").textContent = out;
        }

        function toggleForm() {
            const panel = document.getElementById("form-panel");
            const form = document.getElementById("product-form");
            panel.classList.toggle("open");
            if (!panel.classList.contains("open")) {
                form.reset();
                document.getElementById("f-id").value = "";
                document.getElementById("form-title").textContent = "Add New Product";
            }
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById("f-id").value;
            const name = document.getElementById("f-name").value.trim();
            const category = document.getElementById("f-category").value;
            const price = parseFloat(document.getElementById("f-price").value);
            const stock = parseInt(document.getElementById("f-stock").value);
            const emoji = document.getElementById("f-emoji").value.trim() || "📦";

            if (id) {
                const p = store.products.find(x => x.id === parseInt(id));
                if (p) {
                    p.name = name;
                    p.category = category;
                    p.price = price;
                    p.stock = stock;
                    p.emoji = emoji;
                }
                showToast("Product updated", "success");
            } else {
                const newId = Math.max(0, ...store.products.map(p => p.id)) + 1;
                store.products.push({ id: newId, name, category, price, stock, emoji });
                showToast("Product added", "success");
            }

            saveData(store);
            renderInventory();
            toggleForm();
        }

        function editProduct(id) {
            const p = store.products.find(x => x.id === id);
            if (!p) return;
            document.getElementById("f-id").value = p.id;
            document.getElementById("f-name").value = p.name;
            document.getElementById("f-category").value = p.category;
            document.getElementById("f-price").value = p.price;
            document.getElementById("f-stock").value = p.stock;
            document.getElementById("f-emoji").value = p.emoji;
            document.getElementById("form-title").textContent = "Edit Product";
            document.getElementById("form-panel").classList.add("open");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            const p = store.products.find(x => x.id === id);
            if (!p) return;
            if (!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
            store.products = store.products.filter(x => x.id !== id);
            saveData(store);
            renderInventory();
            showToast("Product deleted", "success");
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderInventory();
        });
    </script>
</body>
</html>
